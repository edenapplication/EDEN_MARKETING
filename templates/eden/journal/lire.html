{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{ edition.titre }} — Journal EDEN GROUP</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IM+Fell+English:ital@0;1&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue:#1B4FDB;--red:#C8102E;
  --grad-h:linear-gradient(90deg,#1B4FDB,#7B20B4,#C8102E);
  --encre:#1a1209;--papier:#FDFBF7;
  --gris-journal:#8B7355;
}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:#0d0d1a;}

/* ── TOP BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(10,10,20,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;z-index:200;gap:6px;
}
.tb-title{font-size:12px;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-num{font-size:10px;color:rgba(255,255,255,0.5);white-space:nowrap;}
.tb-actions{display:flex;gap:4px;flex-shrink:0;}
.tb-btn{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.05);text-decoration:none;transition:all 0.2s;}
.tb-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.page-info-top{font-size:10px;color:rgba(255,255,255,0.5);white-space:nowrap;}

/* ── VIEWER ── */
.viewer-wrap{
  position:fixed;top:52px;left:0;right:0;bottom:60px;
  overflow:hidden;
  background:#0d0d1a;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

/* ── PAGE A4 EXACTEMENT COMME L'ÉDITEUR ── */
.page-canvas{
  position:relative;
  width:595px;
  height:842px;
  background:var(--papier);
  box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.05);
  flex-shrink:0;
  overflow:hidden;
  border-radius:2px;
  transform-origin:center center;
  transition:opacity 0.3s ease, transform 0.2s ease;
}
.page-canvas.fade-out{opacity:0;}

/* ── ÉLÉMENTS ABSOLUS ── */
.canvas-el{position:absolute;}
.el-inner{width:100%;height:100%;overflow:hidden;position:relative;}
.el-text{
  width:100%;height:100%;
  font-family:'Playfair Display',serif;
  color:var(--encre);
  word-break:break-word;
  overflow:hidden;
}
.el-img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
.el-video-wrap{width:100%;height:100%;background:#000;position:relative;display:flex;align-items:center;justify-content:center;}
.el-video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}

/* ── NAV BAR ── */
.nav-bar{
  position:fixed;bottom:0;left:0;right:0;height:60px;
  background:rgba(10,10,20,0.95);backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  gap:1rem;z-index:200;padding:0 1.5rem;
}
.nav-bar-btn{
  padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:'Outfit',sans-serif;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75);
  transition:all 0.2s;
}
.nav-bar-btn:hover:not(:disabled){background:rgba(255,255,255,0.15);color:#fff;}
.nav-bar-btn:disabled{opacity:0.25;cursor:not-allowed;}
.nav-bar-btn.primary{background:linear-gradient(135deg,#1B4FDB,#C8102E);border-color:transparent;color:#fff;}
.nav-progress{display:flex;gap:5px;align-items:center;max-width:200px;overflow:hidden;}
.nav-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.3s;flex-shrink:0;}
.nav-dot.active{background:#fff;width:20px;border-radius:100px;}
.nav-page-label{font-size:12px;color:rgba(255,255,255,0.5);white-space:nowrap;min-width:80px;text-align:center;}

/* ── PROGRESS BAR ── */
.progress-bar{
  position:fixed;top:52px;left:0;right:0;height:3px;z-index:199;
  background:rgba(255,255,255,0.08);
}
.progress-bar-inner{
  height:100%;background:var(--grad-h);
  transition:width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  width:0%;
}

/* ── MEDIA OVERLAY ── */
.media-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:3000;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
.media-overlay.open{display:flex;}
.media-close{
  position:absolute;top:1rem;right:1rem;
  background:rgba(255,255,255,0.1);border:none;color:#fff;
  width:40px;height:40px;border-radius:50%;cursor:pointer;
  font-size:20px;display:flex;align-items:center;justify-content:center;
  transition:background 0.2s;
}
.media-close:hover{background:rgba(255,255,255,0.2);}
.media-inner img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:8px;}
.media-inner video{max-width:90vw;max-height:88vh;border-radius:8px;}

/* ── Retour Académie ── */
.btn-retour-academie{
  position:fixed;top:64px;left:12px;z-index:150;
  display:flex;align-items:center;gap:6px;
  background:rgba(10,36,148,0.85);color:#fff;
  padding:7px 14px;border-radius:8px;font-size:12px;
  font-weight:700;text-decoration:none;
  backdrop-filter:blur(4px);transition:all 0.2s;
}
.btn-retour-academie:hover{background:rgba(10,36,148,1);}

/* ── BARRE D'OUTILS LECTURE ── */
.tools-lecture{
  position:fixed;
  top:60px;right:12px;
  z-index:250;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:rgba(10,10,20,0.85);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:8px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.tl-btn{
  width:38px;height:38px;
  border-radius:8px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.75);
  cursor:pointer;
  font-size:15px;
  font-family:'Outfit',sans-serif;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.tl-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.tl-btn.active{background:rgba(27,79,219,0.4);border-color:var(--blue);color:#fff;}
.tl-sep{width:100%;height:1px;background:rgba(255,255,255,0.08);margin:2px 0;}
.tl-zoom-val{
  font-size:10px;color:rgba(255,255,255,0.5);
  text-align:center;padding:2px 0;
  font-weight:600;
}

/* ── MODE PLEIN ÉCRAN ── */
body.fs-mode .top-bar,
body.fs-mode .nav-bar{display:none;}
body.fs-mode .viewer-wrap{
  top:0;bottom:0;
}
body.fs-mode .tools-lecture{
  top:12px;
}
body.fs-mode .progress-bar{display:none;}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .viewer-wrap{padding:15px 10px;}
}
@media (max-width: 700px){
  .viewer-wrap{padding:10px 5px;}
  .nav-progress{display:none;}
  .nav-bar-btn{padding:6px 12px;font-size:12px;}
  .top-bar{padding:0 8px;}
  .tb-title{font-size:10px;}
  .nav-bar{gap:6px;padding:0 10px;}
  .tools-lecture{
    flex-direction:row;
    top:auto;
    bottom:70px;
    right:50%;
    transform:translateX(50%);
    padding:6px;
  }
  .tl-sep{width:1px;height:100%;margin:0 2px;}
  .tl-btn{width:36px;height:36px;font-size:14px;}
  .tl-zoom-val{min-width:38px;}
}
</style>
</head>
<body>

{% if from_academie %}
<a class="btn-retour-academie" href="{% url 'academie_accueil' %}">← Académie</a>
{% endif %}

<!-- MEDIA OVERLAY -->
<div class="media-overlay" id="media-overlay">
  <button class="media-close" onclick="fermerMedia()">✕</button>
  <div class="media-inner" id="media-inner"></div>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="tb-title">
    <span style="color:rgba(255,255,255,0.4);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-right:8px;">EDEN GROUP</span>
    {{ edition.titre }}
  </div>
  <div class="tb-num">N°{{ edition.numero }}</div>
  <div class="tb-actions">
    <span class="page-info-top" id="page-info">Couverture</span>
    {% if user.is_staff %}
    <a class="tb-btn" href="{% url 'dashboard_journal_page_editer' edition_pk=edition.pk page_num=1 %}">✏ Éditer</a>
    {% endif %}
    <!--<a class="tb-btn" href="{% url 'journal_kiosque' %}">← Kiosque</a> -->
  </div>
</div>

<!-- PROGRESS BAR -->
<div class="progress-bar">
  <div class="progress-bar-inner" id="progress-bar"></div>
</div>

<!-- VIEWER -->
<div class="viewer-wrap" id="viewer">
  <div class="page-canvas" id="page-canvas"></div>
</div>

<!-- BARRE D'OUTILS LECTURE -->
<div class="tools-lecture">
  <button class="tl-btn" onclick="zoomLectureMoins()" title="Zoom arrière (−)">−</button>
  <div class="tl-zoom-val" id="zoom-val">100%</div>
  <button class="tl-btn" onclick="zoomLecturePlus()" title="Zoom avant (+)">+</button>
  <div class="tl-sep"></div>
  <button class="tl-btn" onclick="resetZoomLecture()" title="Ajuster à l'écran (0)">⊡</button>
  <button class="tl-btn" id="btn-rotate" onclick="toggleRotation()" title="Rotation portrait/paysage (R)">⟳</button>
  <button class="tl-btn" id="btn-fullscreen" onclick="togglePleinEcran()" title="Plein écran (F)">⛶</button>
</div>

<!-- NAV BAR -->
<div class="nav-bar">
  <button class="nav-bar-btn" id="btn-prev" onclick="pagePrecedente()" disabled>← Précédent</button>
  <div class="nav-progress" id="nav-dots"></div>
  <span class="nav-page-label" id="nav-label">Couverture</span>
  <button class="nav-bar-btn primary" id="btn-next" onclick="pageSuivante()">Suivant →</button>
</div>

<script>
const PAGES_DATA = {{ pages_json|safe }};
const EDITION = {
  numero: "{{ edition.numero|escapejs }}",
  titre: "{{ edition.titre|escapejs }}",
  sous_titre: "{{ edition.sous_titre|escapejs }}",
  date: "{% if edition.date_parution %}{{ edition.date_parution|date:'d F Y' }}{% endif %}",
  image_une: "{% if edition.image_une %}{{ edition.image_une.url }}{% endif %}",
};
let pageCourante = 0;
const totalCartes = PAGES_DATA.length + 1;
let isTransitioning = false;

// Zoom & rotation
let zoomManuelLecture = 1;
let zoomAuto = 1;
let rotationActive = false;

// ════════════════════════════════════════
// RENDU COUVERTURE
// ════════════════════════════════════════
function renderCouverture() {
  const canvas = document.getElementById('page-canvas');
  canvas.style.background = 'linear-gradient(160deg,#1a1a2e 0%,#0d1b4b 60%,#1a0a0a 100%)';
  canvas.innerHTML = `
    <div style="width:100%;height:100%;display:flex;flex-direction:column;padding:24px 28px 30px;">
      <div style="background:linear-gradient(90deg,#1B4FDB,#7B20B4,#C8102E);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-radius:8px;flex-shrink:0;">
        <span style="font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:1px;">Le Journal <span style="color:#C8102E;">EDEN</span></span>
        <span style="font-size:1rem;font-weight:700;color:rgba(255,255,255,0.85);">N°${EDITION.numero}</span>
      </div>
      <div style="flex:1;overflow:hidden;min-height:0;margin:16px 0;border-radius:8px;">
        ${EDITION.image_une
          ? `<img src="${EDITION.image_une}" alt="Une" onclick="ouvrirMediaImage('${EDITION.image_une}','Couverture')" style="width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;background:linear-gradient(135deg,rgba(27,79,219,0.3),rgba(200,16,46,0.2));border-radius:8px;">📰</div>`}
      </div>
      <div style="padding:12px 0 6px;flex-shrink:0;">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:4px;">EDEN GROUP · Gazette Foncière</div>
        <div style="font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:#fff;line-height:1.2;">${esc(EDITION.titre)}</div>
        ${EDITION.sous_titre ? `<div style="font-size:1rem;color:rgba(255,255,255,0.7);margin-top:4px;font-style:italic;">${esc(EDITION.sous_titre)}</div>` : ''}
      </div>
      <div style="padding:8px 0 0;font-size:0.8rem;color:rgba(255,255,255,0.4);border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0;margin-top:8px;">${EDITION.date}${EDITION.date ? ' · ' : ''}Édition N°${EDITION.numero}</div>
    </div>`;
}

// ════════════════════════════════════════
// RENDU ÉLÉMENT
// ════════════════════════════════════════
function innerHTMLStyle(el){
  const s = el.style || {};
  return `
    font-family:${s.fontFamily||'Playfair Display, serif'};
    font-size:${s.fontSize||12}px;
    color:${s.color||'#1a1209'};
    font-weight:${s.fontWeight||'normal'};
    font-style:${s.fontStyle||'normal'};
    text-decoration:${s.textDecoration||'none'};
    text-align:${s.textAlign||'left'};
    line-height:${s.lineHeight||1.5};
    opacity:${s.opacity!==undefined?s.opacity:1};
    background:${s.background||'transparent'};
    border-radius:${s.borderRadius||0}px;
    padding:${s.padding||0}px;
    ${s.borderLeft ? 'border-left:'+s.borderLeft+';' : ''}
    width:100%;height:100%;overflow:hidden;word-break:break-word;
  `;
}

function renderElement(el){
  const s = el.style || {};
  switch(el.type){
    case 'titre':
    case 'texte':
    case 'chapeau':
      return `<div class="el-inner"><div class="el-text" style="${innerHTMLStyle(el)}">${(el.contenu||'').replace(/\n/g,'<br>')}</div></div>`;
    case 'citation':
      return `<div class="el-inner"><div style="${innerHTMLStyle(el)}">
        <em>${el.contenu||''}</em>
        ${el.auteur ? `<div style="font-size:0.8em;font-weight:700;margin-top:6px;color:#C8102E;">— ${el.auteur}</div>` : ''}
      </div></div>`;
    case 'encart':
      return `<div class="el-inner"><div style="${innerHTMLStyle(el)}">
        ${el.titre_encart ? `<div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#C8102E;margin-bottom:4px;">${el.titre_encart}</div>` : ''}
        <div style="font-size:${s.fontSize||11}px;">${el.contenu||''}</div>
      </div></div>`;
    case 'pub':
      return `<div class="el-inner"><div style="${innerHTMLStyle(el)}">
        <div style="font-family:'Playfair Display',serif;font-size:${(s.fontSize||14)}px;font-weight:900;color:#fff;margin-bottom:4px;">EDEN GROUP</div>
        <div style="font-size:${Math.max((s.fontSize||14)-3,9)}px;color:rgba(255,255,255,0.85);">${el.contenu||''}</div>
        ${el.telephone ? `<div style="margin-top:6px;font-size:${Math.max((s.fontSize||14)-3,9)}px;font-weight:700;color:#fff;">📞 ${el.telephone}</div>` : ''}
      </div></div>`;
    case 'image':
      return el.url
        ? `<div class="el-inner"><img class="el-img" src="${el.url}" alt="${el.legende||''}" style="object-fit:${s.objectFit||'cover'};border-radius:${s.borderRadius||0}px;opacity:${s.opacity!==undefined?s.opacity:1};" onclick="ouvrirMediaImage('${el.url}','${esc(el.legende||'')}')"></div>`
        : `<div class="el-inner"><div style="width:100%;height:100%;background:#e5e7eb;"></div></div>`;
    case 'video':
      return el.url
        ? `<div class="el-inner"><div class="el-video-wrap" style="border-radius:${s.borderRadius||0}px;opacity:${s.opacity!==undefined?s.opacity:1};" onclick="ouvrirMediaVideo('${el.url}','${esc(el.legende||'')}')">
            <video class="el-video" src="${el.url}" preload="metadata" muted></video>
            <div style="position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:none;">▶</div>
          </div></div>`
        : `<div class="el-inner"><div style="width:100%;height:100%;background:#111;"></div></div>`;
    case 'ligne':
      return `<div class="el-inner"><div style="width:100%;height:100%;position:relative;">
        <div style="position:absolute;top:50%;left:0;right:0;height:${s.lineWidth||1}px;background:${s.color||'#1a1209'};transform:translateY(-50%);opacity:${s.opacity!==undefined?s.opacity:1};"></div>
      </div></div>`;
    case 'rect':
      return `<div class="el-inner"><div style="width:100%;height:100%;background:${s.background||'#1B4FDB'};border-radius:${s.borderRadius||0}px;opacity:${s.opacity!==undefined?s.opacity:1};${s.border?'border:'+s.border+';':''}"></div></div>`;
    default:
      return '';
  }
}

// ════════════════════════════════════════
// RENDU PAGE
// ════════════════════════════════════════
function renderPage(pageData){
  const canvas = document.getElementById('page-canvas');
  canvas.style.background = pageData.couleur_fond || '#FDFBF7';

  const elements = pageData.contenu || [];
  const sorted = [...elements].sort((a,b) => (a.z||0) - (b.z||0));

  let html = '';
  sorted.forEach(el => {
    html += `<div class="canvas-el" style="left:${Math.round(el.x)}px;top:${Math.round(el.y)}px;width:${Math.round(el.w)}px;height:${Math.round(el.h)}px;z-index:${(el.z||0)+1};">
      ${renderElement(el)}
    </div>`;
  });
  canvas.innerHTML = html;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════
// ZOOM AUTO + MANUEL + ROTATION
// ════════════════════════════════════════
function appliquerZoomLecture(){
  const canvas = document.getElementById('page-canvas');
  const wrap = document.getElementById('viewer');
  const wrapW = wrap.clientWidth  - 20;
  const wrapH = wrap.clientHeight - 20;

  // Dimensions de référence
  const baseW = rotationActive ? 842 : 595;
  const baseH = rotationActive ? 595 : 842;

  // Facteur auto : fit dans les 2 sens
  zoomAuto = Math.min(wrapW / baseW, wrapH / baseH);
  const scale = zoomAuto * zoomManuelLecture;

  if (rotationActive) {
    canvas.style.transform = `rotate(90deg) scale(${scale})`;
  } else {
    canvas.style.transform = `scale(${scale})`;
  }
  canvas.style.transformOrigin = 'center center';

  // Marges pour centrer proprement
  canvas.style.marginLeft  = ((595 * scale) - 595) / 2 + 'px';
  canvas.style.marginRight = ((595 * scale) - 595) / 2 + 'px';
  canvas.style.marginTop   = ((842 * scale) - 842) / 2 + 'px';
  canvas.style.marginBottom= ((842 * scale) - 842) / 2 + 'px';

  const pct = Math.round(zoomAuto * zoomManuelLecture * 100);
  document.getElementById('zoom-val').textContent = pct + '%';
}

function zoomLecturePlus(){
  zoomManuelLecture = Math.min(zoomManuelLecture + 0.15, 3);
  appliquerZoomLecture();
}

function zoomLectureMoins(){
  zoomManuelLecture = Math.max(zoomManuelLecture - 0.15, 0.3);
  appliquerZoomLecture();
}

function resetZoomLecture(){
  zoomManuelLecture = 1;
  rotationActive = false;
  document.getElementById('btn-rotate')?.classList.remove('active');
  appliquerZoomLecture();
}

function toggleRotation(){
  rotationActive = !rotationActive;
  document.getElementById('btn-rotate')?.classList.toggle('active', rotationActive);
  appliquerZoomLecture();
}

// ════════════════════════════════════════
// PLEIN ÉCRAN
// ════════════════════════════════════════
function togglePleinEcran(){
  const btn = document.getElementById('btn-fullscreen');

  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.()
      .then(() => {
        document.body.classList.add('fs-mode');
        btn?.classList.add('active');
        setTimeout(appliquerZoomLecture, 150);
      })
      .catch(() => alert('Plein écran indisponible'));
  } else {
    document.exitFullscreen?.()
      .then(() => {
        document.body.classList.remove('fs-mode');
        btn?.classList.remove('active');
        setTimeout(appliquerZoomLecture, 150);
      });
  }
}

document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('btn-fullscreen');
  if (!document.fullscreenElement) {
    document.body.classList.remove('fs-mode');
    btn?.classList.remove('active');
    setTimeout(appliquerZoomLecture, 150);
  }
});

// ════════════════════════════════════════
// AFFICHER CARTE
// ════════════════════════════════════════
function afficherCarte(index){
  const canvas = document.getElementById('page-canvas');
  canvas.classList.add('fade-out');

  setTimeout(() => {
    if (index === 0) {
      renderCouverture();
    } else {
      const pageData = PAGES_DATA[index - 1];
      renderPage(pageData);
    }
    canvas.classList.remove('fade-out');

    const progress = (index / (totalCartes - 1)) * 100;
    document.getElementById('progress-bar').style.width = progress + '%';
    document.getElementById('btn-prev').disabled = index === 0;
    document.getElementById('btn-next').disabled = index >= totalCartes - 1;

    const label = index === 0 ? 'Couverture' : `Page ${index}`;
    document.getElementById('page-info').textContent = label;
    document.getElementById('nav-label').textContent = label;

    const dotsEl = document.getElementById('nav-dots');
    dotsEl.innerHTML = Array.from({length: totalCartes}, (_, i) =>
      `<div class="nav-dot ${i === index ? 'active' : ''}"
        onclick="allerPage(${i})"
        title="${i === 0 ? 'Couverture' : 'Page ' + i}"></div>`
    ).join('');

    appliquerZoomLecture();
  }, 200);
}

// ════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════
function pageSuivante() {
  if (isTransitioning || pageCourante >= totalCartes - 1) return;
  isTransitioning = true;
  pageCourante++;
  afficherCarte(pageCourante);
  setTimeout(() => { isTransitioning = false; }, 350);
}

function pagePrecedente() {
  if (isTransitioning || pageCourante <= 0) return;
  isTransitioning = true;
  pageCourante--;
  afficherCarte(pageCourante);
  setTimeout(() => { isTransitioning = false; }, 350);
}

function allerPage(idx) {
  if (isTransitioning || idx === pageCourante || idx < 0 || idx >= totalCartes) return;
  isTransitioning = true;
  pageCourante = idx;
  afficherCarte(pageCourante);
  setTimeout(() => { isTransitioning = false; }, 350);
}

// ════════════════════════════════════════
// SWIPES
// ════════════════════════════════════════
let touchStartX = 0;
let touchStartY = 0;
let isSwiping = false;

document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isSwiping = true;
}, {passive: true});

document.addEventListener('touchmove', (e) => {
  if (!isSwiping) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
    e.preventDefault();
  }
}, {passive: false});

document.addEventListener('touchend', (e) => {
  if (!isSwiping) return;
  isSwiping = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx > 0) pagePrecedente();
    else pageSuivante();
  }
}, {passive: true});

// ── MOUSE DRAG ──
let mouseDown = false;
let mouseStartX = 0;

document.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    mouseDown = true;
    mouseStartX = e.clientX;
  }
});

document.addEventListener('mouseup', (e) => {
  if (!mouseDown) return;
  mouseDown = false;
  const dx = e.clientX - mouseStartX;
  if (Math.abs(dx) > 100) {
    if (dx > 0) pagePrecedente();
    else pageSuivante();
  }
});

// ── CLAVIER ──
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement?.tagName;
  if (['INPUT','TEXTAREA','SELECT'].includes(tag)) return;

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); pageSuivante(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); pagePrecedente(); }
  if (e.key === 'Escape') fermerMedia();

  if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomLecturePlus(); }
  if (e.key === '-') { e.preventDefault(); zoomLectureMoins(); }
  if (e.key === '0') { e.preventDefault(); resetZoomLecture(); }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); toggleRotation(); }
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); togglePleinEcran(); }
});

// ── MEDIA ──
function ouvrirMediaImage(url, legende) {
  document.getElementById('media-inner').innerHTML =
    `<img src="${url}" alt="${legende}">`;
  document.getElementById('media-overlay').classList.add('open');
}

function ouvrirMediaVideo(url, legende) {
  document.getElementById('media-inner').innerHTML =
    `<video src="${url}" controls autoplay>
      Votre navigateur ne supporte pas la vidéo.
    </video>`;
  document.getElementById('media-overlay').classList.add('open');
}

function fermerMedia() {
  const overlay = document.getElementById('media-overlay');
  overlay.classList.remove('open');
  const video = overlay.querySelector('video');
  if (video) { video.pause(); video.src = ''; }
  document.getElementById('media-inner').innerHTML = '';
}

document.getElementById('media-overlay').addEventListener('click', function(e) {
  if (e.target === this) fermerMedia();
});

// ════════════════════════════════════════
// RESIZE
// ════════════════════════════════════════
window.addEventListener('resize', () => {
  setTimeout(appliquerZoomLecture, 100);
});

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
afficherCarte(0);
</script>
