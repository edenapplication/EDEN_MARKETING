{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ edition.titre }} — Journal EDEN GROUP</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue:#1B4FDB;--red:#C8102E;--grad-h:linear-gradient(90deg,#1B4FDB,#7B20B4,#C8102E);
  --encre:#1a1209;--papier:#FDFBF7;--papier2:#FFF8EE;
  --gris-journal:#8B7355;
}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:#0d0d1a;}

/* ── TOP BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(10,10,20,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem;z-index:200;gap:1rem;
}
.tb-title{font-size:13px;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-num{font-size:11px;color:rgba(255,255,255,0.5);white-space:nowrap;}
.tb-actions{display:flex;gap:6px;flex-shrink:0;}
.tb-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.05);text-decoration:none;transition:all 0.2s;}
.tb-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.page-info-top{font-size:11px;color:rgba(255,255,255,0.5);white-space:nowrap;}

/* ── VIEWER ── */
.viewer-wrap{
  position:fixed;top:52px;left:0;right:0;bottom:60px;
  display:flex;align-items:center;justify-content:center;
  perspective:2000px;
}
.book{
  position:relative;
  display:flex;
  transform-style:preserve-3d;
  transition:width 0.3s,height 0.3s;
}
.book-spine{
  position:absolute;left:50%;top:0;bottom:0;
  width:6px;transform:translateX(-50%);
  background:linear-gradient(to right,#8B7355,#C4A97A,#8B7355);
  z-index:10;
  box-shadow:0 0 12px rgba(0,0,0,0.5);
}
.page-outer{
  width:50%;height:100%;
  position:relative;
  overflow:hidden;
}
.page-outer.left{border-radius:4px 0 0 4px;box-shadow:-4px 0 20px rgba(0,0,0,0.5);}
.page-outer.right{border-radius:0 4px 4px 0;box-shadow:4px 0 20px rgba(0,0,0,0.5);}

/* ── PAGE PAPIER ── */
.page-paper{
  width:100%;height:100%;
  position:relative;overflow:hidden;
  background:var(--papier);
  font-family:'IM Fell English',serif;
  color:var(--encre);
}
.page-paper.fonce{background:#1a1a2e !important;}
.page-content{
  position:absolute;inset:0;
  padding:20px 18px 30px;
  overflow:hidden;
}

/* ── LAYOUT COLONNES ── */
.blocs-zone{height:100%;overflow:hidden;}
.layout-col2 .blocs-zone{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  align-content:start;
}
.layout-col3 .blocs-zone{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  align-content:start;
}
.layout-col1 .blocs-zone,.layout-une .blocs-zone{
  display:flex;flex-direction:column;gap:10px;
}

/* ── BLOCS ── */
.bloc{overflow:hidden;}

.bloc-titre h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(1rem,2vw,1.8rem);
  font-weight:900;line-height:1.1;
  color:var(--encre);
  border-bottom:3px double var(--encre);
  padding-bottom:6px;margin-bottom:6px;
}
.bloc-titre h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(0.85rem,1.5vw,1.3rem);
  font-weight:700;line-height:1.2;color:var(--encre);
  border-bottom:1px solid var(--gris-journal);
  padding-bottom:4px;margin-bottom:4px;
}
.bloc-titre h3{
  font-family:'Playfair Display',serif;
  font-size:clamp(0.75rem,1.2vw,1rem);
  font-weight:700;color:var(--encre);
  font-style:italic;margin-bottom:4px;
}
.surtitre{
  font-size:9px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--red);margin-bottom:4px;
}

.bloc-texte p{
  font-size:clamp(0.6rem,0.9vw,0.78rem);
  line-height:1.6;color:var(--encre);
  text-align:justify;hyphens:auto;
  margin-bottom:4px;
}
.bloc-texte .chapeau{
  font-size:clamp(0.65rem,0.95vw,0.85rem);
  font-weight:600;color:var(--encre);
  border-left:3px solid var(--red);
  padding-left:8px;margin-bottom:6px;
  font-style:italic;
  line-height:1.4;
}

.bloc-image figure{text-align:center;}
.bloc-image img{
  max-width:100%;max-height:140px;
  object-fit:cover;border-radius:2px;
  cursor:zoom-in;
  border:1px solid rgba(0,0,0,0.1);
}
.bloc-image figcaption{
  font-size:9px;color:var(--gris-journal);
  font-style:italic;margin-top:3px;
}

/* ✅ VIDÉO LOCALE */
.bloc-video .video-wrap{
  position:relative;width:100%;
  background:#000;border-radius:4px;overflow:hidden;
}
.bloc-video video{
  width:100%;max-height:140px;
  object-fit:cover;display:block;cursor:pointer;
}
.bloc-video .video-overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.3);cursor:pointer;transition:all 0.2s;
}
.bloc-video .video-overlay:hover{background:rgba(0,0,0,0.15);}
.video-play-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,0.9);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:transform 0.2s;
}
.bloc-video figcaption{
  font-size:9px;color:var(--gris-journal);
  font-style:italic;margin-top:3px;text-align:center;
}

.bloc-citation blockquote{
  border-left:3px solid var(--red);
  padding:6px 10px;margin:0;
  background:rgba(200,16,46,0.04);
  border-radius:0 4px 4px 0;
}
.bloc-citation blockquote p{
  font-size:clamp(0.65rem,0.9vw,0.85rem);
  font-style:italic;color:var(--encre);line-height:1.5;
}
.bloc-citation .auteur{
  font-size:9px;font-weight:700;color:var(--red);
  margin-top:4px;text-align:right;letter-spacing:0.5px;
}

.bloc-filet hr{
  border:none;
  border-top:1px solid rgba(0,0,0,0.2);margin:4px 0;
}
.bloc-filet.ornement{text-align:center;color:var(--gris-journal);font-size:11px;}

.bloc-encart{
  background:linear-gradient(135deg,#f5f0e8,#ede7d6);
  border:1px solid #c4a97a;
  border-radius:4px;padding:8px 10px;
}
.bloc-encart .encart-titre{
  font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:1px;
  color:var(--red);margin-bottom:4px;
  padding-bottom:4px;border-bottom:1px solid #c4a97a;
}
.bloc-encart p{font-size:clamp(0.58rem,0.85vw,0.75rem);line-height:1.55;color:var(--encre);}

.bloc-pub{
  background:linear-gradient(135deg,#1B4FDB,#0A2494);
  border-radius:4px;padding:10px;text-align:center;color:#fff;
}
.bloc-pub .pub-titre{font-family:'Playfair Display',serif;font-size:clamp(0.7rem,1.1vw,1rem);font-weight:900;margin-bottom:4px;}
.bloc-pub .pub-texte{font-size:clamp(0.55rem,0.8vw,0.7rem);opacity:0.85;line-height:1.4;}
.bloc-pub .pub-tel{font-size:clamp(0.55rem,0.8vw,0.72rem);font-weight:700;margin-top:6px;background:rgba(255,255,255,0.2);padding:3px 8px;border-radius:100px;}

/* COUVERTURE */
.couverture{
  width:100%;height:100%;
  background:linear-gradient(160deg,#1a1a2e 0%,#0d1b4b 60%,#1a0a0a 100%);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
.couv-bandeau-top{
  background:var(--grad-h);
  padding:8px 16px;
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.couv-nom{font-family:'Playfair Display',serif;font-size:clamp(0.7rem,1.2vw,1rem);font-weight:900;color:#fff;letter-spacing:1px;}
.couv-nom span{color:var(--red);}
.couv-num{font-size:clamp(0.6rem,0.9vw,0.8rem);font-weight:700;color:rgba(255,255,255,0.85);}
.couv-img-zone{flex:1;overflow:hidden;min-height:0;}
.couv-img{width:100%;height:100%;object-fit:cover;display:block;}
.couv-img-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:4rem;
  background:linear-gradient(135deg,rgba(27,79,219,0.3),rgba(200,16,46,0.2));
}
.couv-titre-zone{
  padding:12px 16px 6px;flex-shrink:0;
  background:linear-gradient(to bottom,transparent,rgba(0,0,0,0.8));
}
.couv-surtitre{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:4px;}
.couv-titre{font-family:'Playfair Display',serif;font-size:clamp(0.9rem,1.8vw,1.4rem);font-weight:900;color:#fff;line-height:1.2;}
.couv-sous-titre{font-size:clamp(0.6rem,0.9vw,0.75rem);color:rgba(255,255,255,0.7);margin-top:4px;font-style:italic;}
.couv-date-pied{
  padding:6px 16px;font-size:clamp(0.55rem,0.75vw,0.7rem);
  color:rgba(255,255,255,0.4);letter-spacing:0.5px;
  border-top:1px solid rgba(255,255,255,0.1);flex-shrink:0;
}

/* Numéro de page */
.page-num{
  position:absolute;bottom:8px;font-size:9px;color:var(--gris-journal);
  font-family:'Playfair Display',serif;font-style:italic;
}
.page-num.left{left:12px;}
.page-num.right{right:12px;}
.page-nom-journal{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:7px;color:rgba(139,115,85,0.5);letter-spacing:2px;text-transform:uppercase;
}

/* ── NAV BAR ── */
.nav-bar{
  position:fixed;bottom:0;left:0;right:0;height:60px;
  background:rgba(10,10,20,0.95);backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  gap:1rem;z-index:200;padding:0 1.5rem;
}
.nav-bar-btn{
  padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:'Outfit',sans-serif;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75);
  transition:all 0.2s;
}
.nav-bar-btn:hover:not(:disabled){background:rgba(255,255,255,0.15);color:#fff;}
.nav-bar-btn:disabled{opacity:0.25;cursor:not-allowed;}
.nav-bar-btn.primary{background:linear-gradient(135deg,#1B4FDB,#C8102E);border-color:transparent;color:#fff;}
.nav-progress{display:flex;gap:5px;align-items:center;max-width:200px;overflow:hidden;}
.nav-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;flex-shrink:0;}
.nav-dot.active{background:#fff;width:20px;border-radius:100px;}
.nav-page-label{font-size:12px;color:rgba(255,255,255,0.5);white-space:nowrap;min-width:80px;text-align:center;}

/* MEDIA OVERLAY */
.media-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:3000;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
.media-overlay.open{display:flex;}
.media-close{
  position:absolute;top:1rem;right:1rem;
  background:rgba(255,255,255,0.1);border:none;color:#fff;
  width:38px;height:38px;border-radius:50%;cursor:pointer;
  font-size:18px;display:flex;align-items:center;justify-content:center;
}
.media-inner img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:8px;}
.media-inner video{max-width:90vw;max-height:88vh;border-radius:8px;}

/* ── Retour Académie ── */
.btn-retour-academie{
  position:fixed;top:64px;left:12px;z-index:150;
  display:flex;align-items:center;gap:6px;
  background:rgba(10,36,148,0.85);color:#fff;
  padding:7px 14px;border-radius:8px;font-size:12px;
  font-weight:700;text-decoration:none;
  backdrop-filter:blur(4px);transition:all 0.2s;
}
.btn-retour-academie:hover{background:rgba(10,36,148,1);}

@media(max-width:600px){
  .nav-progress{display:none;}
  .nav-bar-btn{padding:6px 12px;font-size:12px;}
}
</style>
</head>
<body>

{% if from_academie %}
<a class="btn-retour-academie" href="{% url 'academie_accueil' %}">← Académie</a>
{% endif %}

<!-- MEDIA OVERLAY (images + vidéos locales) -->
<div class="media-overlay" id="media-overlay">
  <button class="media-close" onclick="fermerMedia()">✕</button>
  <div class="media-inner" id="media-inner"></div>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="tb-title">
    <span style="color:rgba(255,255,255,0.4);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-right:8px;">Journal EDEN</span>
    {{ edition.titre }}
  </div>
  <div class="tb-num">N°{{ edition.numero }}</div>
  <div class="tb-actions">
    <span class="page-info-top" id="page-info">Couverture</span>
    {% if user.is_staff %}
    <a class="tb-btn" href="{% url 'dashboard_journal_page_editer' edition_pk=edition.pk page_num=1 %}">✏ Éditer</a>
    {% endif %}
    <a class="tb-btn" href="{% url 'journal_kiosque' %}">← Kiosque</a>
  </div>
</div>

<!-- VIEWER -->
<div class="viewer-wrap" id="viewer">
  <div class="book" id="book"></div>
</div>

<!-- NAV -->
<div class="nav-bar">
  <button class="nav-bar-btn" id="btn-prev" onclick="pagePrecedente()" disabled>← Précédent</button>
  <div class="nav-progress" id="nav-dots"></div>
  <span class="nav-page-label" id="nav-label">Couverture</span>
  <button class="nav-bar-btn primary" id="btn-next" onclick="pageSuivante()">Suivant →</button>
</div>

<script>
const PAGES_DATA = {{ pages_json|safe }};
const EDITION = {
  numero: "{{ edition.numero|escapejs }}",
  titre: "{{ edition.titre|escapejs }}",
  sous_titre: "{{ edition.sous_titre|escapejs }}",
  date: "{% if edition.date_parution %}{{ edition.date_parution|date:'d F Y' }}{% endif %}",
  image_une: "{% if edition.image_une %}{{ edition.image_une.url }}{% endif %}",
};
let pageCourante = 0;
const totalEtapes = Math.ceil(PAGES_DATA.length / 2) + 1;

// ── RENDU COUVERTURE ──
function renderCouverture() {
  return `<div class="couverture">
    <div class="couv-bandeau-top">
      <span class="couv-nom">Le Journal <span>EDEN</span></span>
      <span class="couv-num">N°${EDITION.numero}</span>
    </div>
    <div class="couv-img-zone">
      ${EDITION.image_une
        ? `<img class="couv-img" src="${EDITION.image_une}" alt="Une"
            onclick="ouvrirMediaImage('${EDITION.image_une}','Couverture')">`
        : `<div class="couv-img-placeholder">📰</div>`}
    </div>
    <div class="couv-titre-zone">
      <div class="couv-surtitre">EDEN GROUP · Gazette Foncière</div>
      <div class="couv-titre">${EDITION.titre}</div>
      ${EDITION.sous_titre ? `<div class="couv-sous-titre">${EDITION.sous_titre}</div>` : ''}
    </div>
    <div class="couv-date-pied">${EDITION.date}${EDITION.date ? ' · ' : ''}Édition N°${EDITION.numero}</div>
  </div>`;
}

// ── RENDU BLOC ──
function renderBloc(bloc) {
  if (!bloc) return '';
  const type = bloc.type || 'texte';
  switch(type) {
    case 'titre':
      return `<div class="bloc bloc-titre">
        ${bloc.surtitre ? `<div class="surtitre">${esc(bloc.surtitre)}</div>` : ''}
        ${bloc.niveau === 1 ? `<h1>${esc(bloc.contenu||'')}</h1>` :
          bloc.niveau === 3 ? `<h3>${esc(bloc.contenu||'')}</h3>` :
          `<h2>${esc(bloc.contenu||'')}</h2>`}
      </div>`;

    case 'texte':
      const lignes = (bloc.contenu||'').split('\n').filter(l=>l.trim());
      return `<div class="bloc bloc-texte">
        ${bloc.chapeau ? `<p class="chapeau">${esc(bloc.chapeau)}</p>` : ''}
        ${lignes.map(l=>`<p>${esc(l)}</p>`).join('')||'<p></p>'}
      </div>`;

    case 'image':
      if (!bloc.url) return '';
      return `<div class="bloc bloc-image">
        <figure>
          <img src="${bloc.url}" alt="${esc(bloc.legende||'')}"
            onclick="ouvrirMediaImage('${bloc.url}','${esc(bloc.legende||'')}')">
          ${bloc.legende ? `<figcaption>${esc(bloc.legende)}</figcaption>` : ''}
        </figure>
      </div>`;

    // ✅ VIDÉO LOCALE
    case 'video':
      if (!bloc.url) return '';
      return `<div class="bloc bloc-video">
        <div class="video-wrap" onclick="ouvrirMediaVideo('${bloc.url}','${esc(bloc.legende||'')}')">
          <video src="${bloc.url}" preload="metadata" muted>
            Votre navigateur ne supporte pas la vidéo HTML5.
          </video>
          <div class="video-overlay">
            <div class="video-play-btn">▶</div>
          </div>
        </div>
        ${bloc.legende ? `<figcaption>${esc(bloc.legende)}</figcaption>` : ''}
      </div>`;

    case 'citation':
      return `<div class="bloc bloc-citation">
        <blockquote>
          <p>${esc(bloc.contenu||'')}</p>
          ${bloc.auteur ? `<div class="auteur">— ${esc(bloc.auteur)}</div>` : ''}
        </blockquote>
      </div>`;

    case 'filet':
      return `<div class="bloc bloc-filet ${bloc.style === 'ornement' ? 'ornement' : ''}">
        ${bloc.style === 'ornement' ? '<div>✦ ✦ ✦</div>' : '<hr>'}
      </div>`;

    case 'encart':
      return `<div class="bloc bloc-encart">
        ${bloc.titre_encart ? `<div class="encart-titre">${esc(bloc.titre_encart)}</div>` : ''}
        <p>${esc(bloc.contenu||'')}</p>
      </div>`;

    case 'pub':
      return `<div class="bloc bloc-pub">
        <div class="pub-titre">EDEN GROUP</div>
        <div class="pub-texte">${esc(bloc.contenu||'')}</div>
        ${bloc.telephone ? `<div class="pub-tel">📞 ${esc(bloc.telephone)}</div>` : ''}
      </div>`;

    default:
      return `<div class="bloc" style="padding:6px;font-size:10px;color:#bbb;font-style:italic;">Bloc: ${type}</div>`;
  }
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPage(pageData, numeroAffiche, isGauche) {
  const layout = pageData.layout || 'col2';
  const fond = pageData.couleur_fond || '#FDFBF7';
  const blocs = pageData.contenu || [];
  return `<div class="page-paper layout-${layout}" style="background:${fond};">
    <div class="page-content">
      <div class="blocs-zone">
        ${blocs.map(b => renderBloc(b)).join('')}
      </div>
    </div>
    <div class="page-num ${isGauche ? 'left' : 'right'}">${numeroAffiche}</div>
    <div class="page-nom-journal">Journal EDEN</div>
  </div>`;
}

// ── DIMENSIONS ──
function calculerDimensions() {
  const vw = window.innerWidth;
  const vh = window.innerHeight - 112;
  const ratio = 210 / 297;
  let pageH = Math.min(vh * 0.93, 780);
  let pageW = pageH * ratio;
  if (pageW * 2 > vw * 0.95) {
    pageW = (vw * 0.95) / 2;
    pageH = pageW / ratio;
  }
  return { pageW, pageH };
}

// ── AFFICHAGE ──
function afficherPage(index) {
  pageCourante = Math.max(0, Math.min(index, totalEtapes - 1));
  const { pageW, pageH } = calculerDimensions();
  const book = document.getElementById('book');
  book.style.width = (pageW * 2) + 'px';
  book.style.height = pageH + 'px';

  let htmlGauche, htmlDroite;

  if (pageCourante === 0) {
    // Couverture
    htmlGauche = `<div class="page-paper fonce"></div>`;
    htmlDroite = renderCouverture();
  } else {
    const idxGauche = (pageCourante - 1) * 2;
    const idxDroite = idxGauche + 1;

    if (idxGauche < PAGES_DATA.length) {
      htmlGauche = renderPage(PAGES_DATA[idxGauche], idxGauche + 1, true);
    } else {
      htmlGauche = `<div class="page-paper fonce"></div>`;
    }

    if (idxDroite < PAGES_DATA.length) {
      htmlDroite = renderPage(PAGES_DATA[idxDroite], idxDroite + 1, false);
    } else {
      htmlDroite = `<div class="page-paper fonce"></div>`;
    }
  }

  book.innerHTML = `
    <div class="page-outer left">${htmlGauche}</div>
    <div class="book-spine"></div>
    <div class="page-outer right">${htmlDroite}</div>
  `;
  mettreAjourNav();
}

// ── NAVIGATION ──
function pageSuivante() {
  if (pageCourante >= totalEtapes - 1) return;
  const right = document.querySelector('.page-outer.right');
  if (right) {
    right.style.transition = 'transform 0.5s ease';
    right.style.transform = 'rotateY(-180deg)';
    setTimeout(() => {
      right.style.transition = '';
      right.style.transform = '';
      afficherPage(pageCourante + 1);
    }, 250);
  } else {
    afficherPage(pageCourante + 1);
  }
}

function pagePrecedente() {
  if (pageCourante <= 0) return;
  const left = document.querySelector('.page-outer.left');
  if (left) {
    left.style.transition = 'transform 0.5s ease';
    left.style.transform = 'rotateY(180deg)';
    setTimeout(() => {
      left.style.transition = '';
      left.style.transform = '';
      afficherPage(pageCourante - 1);
    }, 250);
  } else {
    afficherPage(pageCourante - 1);
  }
}

function allerPage(idx) { afficherPage(idx); }

function mettreAjourNav() {
  document.getElementById('btn-prev').disabled = pageCourante === 0;
  document.getElementById('btn-next').disabled = pageCourante >= totalEtapes - 1;

  const nbPagesAffichees = PAGES_DATA.length;
  if (pageCourante === 0) {
    document.getElementById('page-info').textContent = 'Couverture';
    document.getElementById('nav-label').textContent = 'Couverture';
  } else {
    const pg1 = (pageCourante - 1) * 2 + 1;
    const pg2 = pg1 + 1;
    const label = pg2 <= nbPagesAffichees ? `Pages ${pg1}-${pg2}` : `Page ${pg1}`;
    document.getElementById('page-info').textContent = label;
    document.getElementById('nav-label').textContent = label;
  }

  const dotsEl = document.getElementById('nav-dots');
  dotsEl.innerHTML = Array.from({length: totalEtapes}, (_, i) =>
    `<div class="nav-dot ${i === pageCourante ? 'active' : ''}"
      onclick="allerPage(${i})"
      title="${i === 0 ? 'Couverture' : 'Pages ' + ((i-1)*2+1)}"></div>`
  ).join('');
}

// ── MEDIA OVERLAY ──
function ouvrirMediaImage(url, legende) {
  document.getElementById('media-inner').innerHTML =
    `<img src="${url}" alt="${legende}" style="max-width:90vw;max-height:88vh;object-fit:contain;border-radius:8px;">`;
  document.getElementById('media-overlay').classList.add('open');
}

function ouvrirMediaVideo(url, legende) {
  document.getElementById('media-inner').innerHTML =
    `<video src="${url}" controls autoplay style="max-width:90vw;max-height:88vh;border-radius:8px;">
      Votre navigateur ne supporte pas la vidéo.
    </video>`;
  document.getElementById('media-overlay').classList.add('open');
}

function fermerMedia() {
  const overlay = document.getElementById('media-overlay');
  overlay.classList.remove('open');
  // Arrêter la vidéo si en cours
  const video = overlay.querySelector('video');
  if (video) { video.pause(); video.src = ''; }
  document.getElementById('media-inner').innerHTML = '';
}

// ── CLAVIER / SWIPE ──
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pageSuivante();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') pagePrecedente();
  if (e.key === 'Escape') fermerMedia();
});

let _tX = 0;
document.addEventListener('touchstart', e => { _tX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const d = _tX - e.changedTouches[0].clientX;
  if (Math.abs(d) > 50) d > 0 ? pageSuivante() : pagePrecedente();
});

document.getElementById('media-overlay').addEventListener('click', function(e) {
  if (e.target === this) fermerMedia();
});

window.addEventListener('resize', () => afficherPage(pageCourante));

// ── INIT ──
afficherPage(0);
</script>
</body>
