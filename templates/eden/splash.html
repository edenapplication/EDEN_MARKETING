{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenue à EDEN GROUP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root {
    --blue:#17396d;
    --blue-light:#2f64b8;
    --red:#a9091c;
    --red-light:#d3132a;
    --dark:#14233b;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:"Outfit", Arial, sans-serif;
}

#eden-intro {
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    background:#fff;
}

/* =========================================================
   VILLE EN FOND
   ========================================================= */
.city {
    position:absolute;
    inset:-3%;
    background: url("/static/images/fond.png") center center / cover no-repeat;
    opacity:0;
    filter:blur(8px) brightness(1.04);
    transform:scale(1.06);
    animation:
        cityReveal 1.1s ease-out forwards,
        cityTravel 8.9s cubic-bezier(.2,.6,.25,1) 1.1s forwards;
}

@keyframes cityReveal {
    0% {
        opacity:0;
        filter:blur(12px) brightness(1.08);
        transform:scale(1.10);
    }
    100% {
        opacity:1;
        filter:blur(0) brightness(1.01);
        transform:scale(1.05);
    }
}

@keyframes cityTravel {
    from { transform:scale(1.05); }
    to   { transform:scale(1.095); }
}

.overlay {
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center 42%,
            rgba(255,255,255,.97) 0%,
            rgba(255,255,255,.91) 25%,
            rgba(255,255,255,.66) 50%,
            rgba(255,255,255,.18) 100%
        );
    opacity:0;
    animation:overlayIn .8s ease .35s forwards;
}

@keyframes overlayIn {
    to {opacity:1;}
}

.vignette {
    position:absolute;
    inset:0;
    background:
        linear-gradient(to bottom,
            rgba(255,255,255,.05) 0%,
            transparent 65%,
            rgba(13,31,60,.10) 100%
        );
    pointer-events:none;
}

/* =========================================================
   CONTENU
   ========================================================= */
.content {
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
}

/* =========================================================
   LOGO : 1,10 -> 2,20
   ========================================================= */
.logo-window {
    width:min(820px,76vw);
    overflow:hidden;
    opacity:0;
    transform:translateY(8px) scale(.985);
    animation:logoWindowIn .28s ease 1.20s forwards;
}

.logo-reveal {
    clip-path:inset(0 100% 0 0);
    animation:logoReveal 1s cubic-bezier(.22,.8,.2,1) 1.35s forwards;
}

.logo-reveal img {
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 12px 28px rgba(20,45,90,.08));
}

@keyframes logoWindowIn {
    to {
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes logoReveal {
    to { clip-path:inset(0 0 0 0); }
}

/* =========================================================
   SÉCURITÉ : 2,10 -> 2,80
   ========================================================= */
.security {
    margin-top:16px;
    opacity:0;
    transform:translateY(9px);
    animation:rise .48s ease 2.40s forwards;
}

.security-title {
    font-size:clamp(17px,1.9vw,29px);
    font-weight:800;
    letter-spacing:.05em;
    color:var(--blue);
    text-transform:uppercase;
}

.security-row {
    margin:10px auto 0;
    width:min(500px,65vw);
    display:flex;
    align-items:center;
    gap:14px;
}

.rule {
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--blue));
}

.rule.right {
    background:linear-gradient(90deg,var(--red),transparent);
}

.shield {
    position:relative;
    width:40px;
    height:46px;
    clip-path:polygon(50% 0,88% 16%,82% 68%,50% 100%,18% 68%,12% 16%);
    background:linear-gradient(135deg,var(--blue),var(--red));
    opacity:0;
    transform:scale(.65);
    animation:shieldIn .42s cubic-bezier(.34,1.56,.64,1) 2.70s forwards;
}

.shield::before {
    content:"";
    position:absolute;
    inset:3px;
    clip-path:inherit;
    background:#fff;
}

.shield::after {
    content:"✓";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:var(--blue);
    font-size:19px;
    font-weight:900;
}

@keyframes shieldIn {
    to {
        opacity:1;
        transform:scale(1);
    }
}

/* =========================================================
   MESSAGE
   Apparition complète à 2,80 s
   Visible jusqu'à 5,60 s
   = 2,8 secondes de visibilité
   ========================================================= */
.promise {
    margin-top:18px;
    font-size:clamp(17px,1.65vw,25px);
    font-weight:600;
    line-height:1.4;
    color:var(--blue);
}

.promise-line {
    display:block;
    opacity:0;
    transform:translateY(9px);
}

.promise-line.one {
    animation:promiseIn .70s ease 3.60s forwards;
}

.promise-line.two {
    animation:promiseIn .70s ease 4.50s forwards;
}

.promise strong {
    color:var(--red);
    font-weight:700;
}

@keyframes promiseIn {
    0% {
        opacity:0;
        transform:translateY(14px);
        filter:blur(3px);
    }
    100% {
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}

/* =========================================================
   BOUTON : 5,10 -> 6,20
   ========================================================= */
#welcome {
    position:relative;
    margin-top:28px;
    width:min(570px,74vw);
    min-height:66px;
    border:1px solid rgba(255,255,255,.82);
    border-radius:999px;
    padding:0 32px;
    color:#fff;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.14) 0%,
            rgba(255,255,255,.03) 38%,
            rgba(0,0,0,.08) 100%
        ),
        linear-gradient(
            90deg,
            #0c4ea7 0%,
            #173d78 30%,
            #252b5c 49%,
            #6b1832 70%,
            #d50c1d 100%
        );
    box-shadow:
        -16px 0 36px rgba(24,102,255,.50),
         16px 0 36px rgba(235,18,35,.48),
         0 12px 0 rgba(12,25,50,.28),
         0 18px 28px rgba(10,28,55,.22),
         inset 0 2px 0 rgba(255,255,255,.40),
         inset 0 -3px 0 rgba(0,0,0,.14);
    font:800 clamp(15px,1.35vw,21px)/1 "Outfit",Arial,sans-serif;
    letter-spacing:.015em;
    cursor:pointer;
    overflow:visible;
    opacity:0;
    transform:
        perspective(400px)
        rotateX(4deg)
        translateY(5px)
        scale(.96);
    transform-origin:center bottom;
    animation:buttonIn3D .58s cubic-bezier(.34,1.35,.64,1) 6.90s forwards;
    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}

#welcome .inside {
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    text-shadow:0 2px 3px rgba(0,0,0,.28);
}

.arrow {
    display:inline-block;
    font-size:24px;
    font-weight:400;
    animation:arrowMove .7s ease-in-out 7.55s infinite alternate;
}

#welcome::before {
    content:"";
    position:absolute;
    top:-50%;
    bottom:-50%;
    left:-20%;
    width:14%;
    transform:skewX(-10deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.95),
        transparent
    );
    opacity:0;
}

#welcome.shine::before {
    animation:buttonShine .7s ease forwards;
}


#welcome::after {
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:inherit;
    pointer-events:none;
    background:
        radial-gradient(circle at 0% 50%, rgba(39,125,255,.98), transparent 22%),
        radial-gradient(circle at 100% 50%, rgba(255,27,41,.98), transparent 22%);
    filter:blur(12px);
    opacity:.78;
    z-index:-2;
}

#welcome .inside::before {
    content:"";
    position:absolute;
    left:7%;
    right:7%;
    top:5px;
    height:22px;
    border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0));
    pointer-events:none;
}

#welcome:hover {
    transform:
        perspective(800px)
        rotateX(5deg)
        translateY(-3px)
        scale(1.025);
    box-shadow:
        -18px 0 42px rgba(24,102,255,.62),
         18px 0 42px rgba(235,18,35,.60),
         0 15px 0 rgba(12,25,50,.25),
         0 23px 34px rgba(10,28,55,.24),
         inset 0 2px 0 rgba(255,255,255,.46),
         inset 0 -3px 0 rgba(0,0,0,.12);
    filter:brightness(1.04);
}

#welcome:active {
    transform:
        perspective(800px)
        rotateX(10deg)
        translateY(5px)
        scale(.995);
    box-shadow:
        -12px 0 28px rgba(24,102,255,.46),
         12px 0 28px rgba(235,18,35,.44),
         0 5px 0 rgba(12,25,50,.30),
         0 10px 18px rgba(10,28,55,.18),
         inset 0 2px 0 rgba(255,255,255,.30),
         inset 0 -3px 0 rgba(0,0,0,.18);
}

@keyframes buttonIn3D {
    0% {
        opacity:0;
        transform:
            perspective(800px)
            rotateX(14deg)
            translateY(18px)
            scale(.93);
    }
    65% {
        opacity:1;
        transform:
            perspective(800px)
            rotateX(6deg)
            translateY(-2px)
            scale(1.015);
    }
    100% {
        opacity:1;
        transform:
            perspective(800px)
            rotateX(8deg)
            translateY(0)
            scale(1);
    }
}

@keyframes buttonIn {
    to {
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes arrowMove {
    to {transform:translateX(6px);}
}

@keyframes buttonShine {
    0% {left:-30%;opacity:0;}
    15% {opacity:.95;}
    100% {left:115%;opacity:0;}
}

/* =========================================================
   REFLET FINAL : 6,15 -> 6,80
   ========================================================= */
.global-shine {
    position:absolute;
    z-index:8;
    top:10%;
    bottom:10%;
    left:-18%;
    width:10%;
    pointer-events:none;
    transform:skewX(-16deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.90),
        transparent
    );
    opacity:0;
}

#eden-intro.light-pass .global-shine {
    animation:lightPass .65s ease forwards;
}

@keyframes lightPass {
    0% {left:-18%;opacity:0;}
    15% {opacity:.9;}
    100% {left:112%;opacity:0;}
}

/* =========================================================
   SORTIE : 6,80 -> 7,00
   ========================================================= */
#eden-intro.entering .content {
    animation:contentOut .20s ease forwards;
}

#eden-intro.entering .city {
    animation:cityOut .20s ease forwards;
}

@keyframes contentOut {
    to {
        opacity:0;
        transform:scale(1.02);
        filter:blur(1px);
    }
}

@keyframes cityOut {
    to {
        transform:scale(1.13);
        filter:blur(1.5px) brightness(1.08);
    }
}

@keyframes rise {
    to {
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   MOBILE
   ========================================================= */
@media(max-width:700px) {
    .content {
        padding:18px;
    }

    .logo-window {
        width:92vw;
    }

    .security {
        margin-top:13px;
    }

    .security-title {
        font-size:15px;
    }

    .security-row {
        width:72vw;
        gap:10px;
    }

    .shield {
        width:33px;
        height:38px;
    }

    .shield::after {
        font-size:15px;
    }

    .promise {
        margin-top:13px;
        font-size:15px;
        max-width:92vw;
    }

    #welcome {
        margin-top:18px;
        width:min(90vw,500px);
        min-width:0;
        min-height:58px;
        padding:0 18px;
        font-size:13px;
        transform:
            perspective(700px)
            rotateX(7deg)
            scale(.98);
    }

    #welcome .inside {
        min-height:56px;
        gap:16px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation-duration:.01ms !important;
        animation-delay:0ms !important;
    }
}
</style>
</head>

<script>
(function () {
    const intro = document.getElementById("eden-intro");
    const welcome = document.getElementById("welcome");

    let finished = false;
    let redirectTimer;

    function goHome() {
        if (finished) return;
        finished = true;

        if (redirectTimer) clearTimeout(redirectTimer);

        intro.classList.add("entering");

        setTimeout(() => {
            window.location.href = "{% url 'home' %}";
        }, 200);
    }

    // 8,65 s : reflet premium
    setTimeout(() => {
        intro.classList.add("light-pass");
        welcome.classList.add("shine");
    }, 8650);

    // 9,70 s : début de transition
    setTimeout(() => {
        if (!finished) {
            intro.classList.add("entering");
        }
    }, 9700);

    // 10,00 s : ouverture automatique exacte
    redirectTimer = setTimeout(() => {
        window.location.href = "{% url 'home' %}";
    }, 10000);

    // Accès immédiat au clic
    welcome.addEventListener("click", goHome);
})();
</script>
