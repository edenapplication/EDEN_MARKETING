{% extends 'base_admin.html' %}

{% block title %}À Propos — Configuration{% endblock %}

{% block admin_content %}
<div style="max-width: 700px; margin: 0 auto;">

    <a href="{% url 'dashboard_apropos_etapes' section.pk %}" style="display: inline-flex; align-items: center; gap: 6px; color: #6B7280; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px;">
        ← Retour aux étapes
    </a>

    <div style="background: #fff; border: 1.5px solid #E5E7EB; border-radius: 16px; padding: 32px;">

        <h2 style="font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: #1F2937; margin-bottom: 24px;">
            {% if etape %}Modifier l'étape{% else %}Nouvelle étape de la timeline{% endif %}
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #4B5563; margin-bottom: 8px;">
                    Année / Date <span style="color: #DC2626;">*</span>
                </label>
                <input type="text" name="annee" required
                       value="{{ etape.annee|default:'' }}"
                       placeholder="Ex: 1956"
                       style="width: 100%; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px; font-size: 1.3rem; font-family: 'Playfair Display', serif; font-weight: 700; text-align: center; color: #1B4FDB;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #4B5563; margin-bottom: 8px;">
                    Description <span style="color: #DC2626;">*</span>
                </label>
                <textarea name="description" required rows="4"
                          placeholder="Décrivez cet événement..."
                          style="width: 100%; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px; font-size: 0.9rem; font-family: inherit; resize: vertical; line-height: 1.6;">{{ etape.description|default:'' }}</textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #4B5563; margin-bottom: 8px;">
                    Position sur la timeline
                </label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <label style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px; cursor: pointer; transition: all 0.2s;"
                           onmouseover="this.style.background='#F9FAFB';" onmouseout="this.style.background='';">
                        <input type="radio" name="position" value="gauche"
                               {% if not etape or etape.position == 'gauche' %}checked{% endif %}
                               style="width: 18px; height: 18px; cursor: pointer;">
                        <span style="font-size: 0.9rem; color: #4B5563; font-weight: 500;">
                            ⬅️ Gauche (date à droite)
                        </span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px; cursor: pointer; transition: all 0.2s;"
                           onmouseover="this.style.background='#F9FAFB';" onmouseout="this.style.background='';">
                        <input type="radio" name="position" value="droite"
                               {% if etape and etape.position == 'droite' %}checked{% endif %}
                               style="width: 18px; height: 18px; cursor: pointer;">
                        <span style="font-size: 0.9rem; color: #4B5563; font-weight: 500;">
                            ➡️ Droite (date à gauche)
                        </span>
                    </label>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #4B5563; margin-bottom: 8px;">
                        Ordre
                    </label>
                    <input type="number" name="ordre" min="0"
                           value="{{ etape.ordre|default:0 }}"
                           style="width: 100%; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px; font-size: 0.95rem; font-family: inherit;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #4B5563; margin-bottom: 8px;">
                        Statut
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px; cursor: pointer;">
                        <input type="checkbox" name="is_active"
                               {% if not etape or etape.is_active %}checked{% endif %}
                               style="width: 18px; height: 18px; cursor: pointer;">
                        <span style="font-size: 0.9rem; color: #4B5563;">Actif</span>
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 30px; padding-top: 24px; border-top: 1.5px solid #F3F4F6;">
                <a href="{% url 'dashboard_apropos_etapes' section.pk %}"
                   style="padding: 12px 24px; border: 1.5px solid #E5E7EB; border-radius: 10px; text-decoration: none; color: #4B5563; font-weight: 600; font-size: 0.9rem;">
                    Annuler
                </a>
                <button type="submit"
                        style="background: linear-gradient(135deg, #1B4FDB, #7B20B4); color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; font-family: inherit;">
                    💾 Enregistrer
                </button>
            </div>

        </form>

    </div>
</div>
{% endblock %}
