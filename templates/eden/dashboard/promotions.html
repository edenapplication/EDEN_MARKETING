{% extends 'base_admin.html' %}
{% block admin_content %}
<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Promotions Admin — EDEN GROUP</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
{% load humanize %}
<style>*{margin:0;padding:0;box-sizing:border-box;}:root{--blue:#1B4FDB;--red:#C8102E;--grad:linear-gradient(135deg,#1B4FDB 0%,#7B20B4 50%,#C8102E 100%);--bpale:#EEF3FF;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g500:#6B7280;--g800:#1F2937;--r:12px;--rl:20px;}body{font-family:'Outfit',sans-serif;background:var(--g50);color:var(--g800);}.topnav{position:fixed;top:0;left:0;right:0;height:64px;background:#fff;border-bottom:1.5px solid var(--g200);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;}.tn-em{width:36px;height:36px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:#fff;}.tn-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}.tn-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;border:1.5px solid var(--g200);background:#fff;color:var(--g500);font-family:'Outfit',sans-serif;}.wrap{display:flex;padding-top:64px;}.sidebar{width:240px;background:#fff;border-right:1.5px solid var(--g200);position:fixed;top:64px;left:0;bottom:0;overflow-y:auto;}.sb-sec{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--g400);padding:1.2rem 1.5rem 0.4rem;}.sb-lnk{display:flex;align-items:center;gap:10px;padding:10px 1.5rem;font-size:13px;font-weight:500;color:var(--g500);border-left:2px solid transparent;text-decoration:none;}.sb-lnk:hover,.sb-lnk.active{color:var(--blue);background:var(--bpale);border-left-color:var(--blue);}.main{flex:1;padding:2rem;margin-left:240px;}.page-tit{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--g800);margin-bottom:1.5rem;}.dash-card{background:#fff;border:1.5px solid var(--g200);border-radius:var(--rl);padding:1.4rem;margin-bottom:1.5rem;}.card-tit{font-size:14px;font-weight:700;color:var(--g800);margin-bottom:1rem;}table{width:100%;border-collapse:collapse;font-size:13px;}th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--g400);border-bottom:1.5px solid var(--g200);}td{padding:11px 14px;border-bottom:1px solid var(--g100);color:var(--g700);}tr:hover td{background:var(--g50);}.badge-promo{background:linear-gradient(135deg,rgba(27,79,219,0.1),rgba(200,16,46,0.08));border:1.5px solid rgba(200,16,46,0.15);border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;color:#dc2626;}@media(max-width:1024px){.sidebar{display:none;}.main{margin-left:0;}}</style>
</head>
<body>
<nav class="topnav"><div style="display:flex;align-items:center;gap:8px;"><div class="tn-em">E</div><div class="tn-name">EDEN GROUP</div></div><div style="display:flex;gap:8px;"><a class="tn-btn" href="{% url 'dashboard_home' %}">← Dashboard</a><a class="tn-btn" href="{% url 'logout' %}" style="background:#fee2e2;border-color:#fca5a5;color:#dc2626;">Deconnexion</a></div></nav>
<div class="wrap">

</div>
</div>
</body>
</html>
{% endblock %}
